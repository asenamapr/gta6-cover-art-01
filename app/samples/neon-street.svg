<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b0533"/>
      <stop offset="0.45" stop-color="#5b1a6e"/>
      <stop offset="0.72" stop-color="#c22a7a"/>
      <stop offset="1" stop-color="#ff6b4a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe259"/>
      <stop offset="0.55" stop-color="#ff7e3d"/>
      <stop offset="1" stop-color="#ff2e88"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a123e"/>
      <stop offset="1" stop-color="#0d0218"/>
    </linearGradient>
    <linearGradient id="wet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2e88" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="720" height="900" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="70" r="2"/><circle cx="150" cy="40" r="1.5"/>
    <circle cx="240" cy="110" r="2"/><circle cx="330" cy="55" r="1.5"/>
    <circle cx="470" cy="90" r="2"/><circle cx="560" cy="45" r="1.5"/>
    <circle cx="650" cy="120" r="2"/><circle cx="700" cy="60" r="1.5"/>
    <circle cx="110" cy="160" r="1.5"/><circle cx="600" cy="180" r="1.5"/>
    <circle cx="410" cy="140" r="1.5"/><circle cx="40" cy="230" r="1.5"/>
  </g>

  <!-- retro sun with cut stripes -->
  <g>
    <circle cx="360" cy="400" r="150" fill="url(#sun)"/>
    <g fill="#1b0533" opacity="0.85">
      <rect x="195" y="392" width="330" height="10"/>
      <rect x="195" y="418" width="330" height="14"/>
      <rect x="195" y="448" width="330" height="18"/>
      <rect x="195" y="482" width="330" height="24"/>
      <rect x="195" y="520" width="330" height="30"/>
    </g>
    <circle cx="360" cy="400" r="150" fill="none" stroke="#ff9de2" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- distant skyline -->
  <g fill="#16042a">
    <rect x="0" y="470" width="70" height="180"/>
    <rect x="78" y="520" width="56" height="130"/>
    <rect x="142" y="440" width="64" height="210"/>
    <rect x="214" y="500" width="48" height="150"/>
    <rect x="470" y="500" width="52" height="150"/>
    <rect x="530" y="450" width="66" height="200"/>
    <rect x="604" y="510" width="52" height="140"/>
    <rect x="664" y="470" width="56" height="180"/>
  </g>
  <!-- lit windows -->
  <g fill="#ffd166">
    <rect x="18" y="500" width="8" height="10"/><rect x="42" y="540" width="8" height="10"/>
    <rect x="92" y="550" width="8" height="10"/><rect x="158" y="480" width="8" height="10"/>
    <rect x="178" y="530" width="8" height="10"/><rect x="548" y="490" width="8" height="10"/>
    <rect x="572" y="540" width="8" height="10"/><rect x="620" y="540" width="8" height="10"/>
    <rect x="682" y="510" width="8" height="10"/><rect x="228" y="530" width="8" height="10"/>
  </g>

  <!-- horizon glow -->
  <rect x="0" y="620" width="720" height="60" fill="#ff2e88" opacity="0.25" filter="url(#soft)"/>

  <!-- road -->
  <polygon points="0,900 720,900 520,650 200,650" fill="url(#road)"/>
  <polygon points="330,900 390,900 372,650 348,650" fill="url(#wet)"/>
  <!-- lane dashes -->
  <g fill="#ffe259">
    <polygon points="352,680 368,680 366,712 354,712"/>
    <polygon points="348,742 372,742 370,782 350,782"/>
    <polygon points="342,812 378,812 376,860 344,860"/>
  </g>
  <!-- road edge neon -->
  <line x1="200" y1="650" x2="0" y2="900" stroke="#00e5ff" stroke-width="4" filter="url(#glow)"/>
  <line x1="520" y1="650" x2="720" y2="900" stroke="#ff2e88" stroke-width="4" filter="url(#glow)"/>

  <!-- left palm silhouette -->
  <g fill="#0a0114">
    <path d="M84 660 C 96 540 92 460 70 380 C 66 366 78 360 84 372 C 104 440 108 540 100 660 Z"/>
    <path d="M70 384 C 30 350 8 352 -6 380 C 22 372 48 386 66 402 Z"/>
    <path d="M72 380 C 60 330 78 300 108 292 C 92 318 84 348 82 378 Z"/>
    <path d="M74 380 C 100 332 140 318 168 330 C 138 344 110 362 88 392 Z"/>
    <path d="M76 382 C 110 356 150 360 172 384 C 140 386 106 392 84 404 Z"/>
    <path d="M68 386 C 40 368 12 376 -2 396 C 26 392 50 398 64 408 Z"/>
  </g>
  <!-- right palm silhouette -->
  <g fill="#0a0114">
    <path d="M640 660 C 628 550 632 480 654 410 C 658 396 646 390 640 402 C 622 470 618 560 626 660 Z"/>
    <path d="M654 412 C 690 380 712 384 726 408 C 700 400 676 412 660 428 Z"/>
    <path d="M652 408 C 662 360 646 332 618 324 C 632 350 640 378 642 406 Z"/>
    <path d="M650 408 C 626 362 588 350 562 362 C 590 376 616 394 636 422 Z"/>
    <path d="M648 410 C 616 384 578 388 556 410 C 586 412 618 418 640 438 Z"/>
  </g>

  <!-- neon signs -->
  <g font-family="Arial Black, sans-serif" font-weight="900" text-anchor="middle">
    <text x="360" y="120" font-size="54" fill="#00e5ff" filter="url(#glow)" letter-spacing="6">VICE</text>
    <text x="360" y="168" font-size="54" fill="#ff2e88" filter="url(#glow)" letter-spacing="6">NIGHTS</text>
    <text x="120" y="300" font-size="26" fill="#ffe259" filter="url(#glow)" transform="rotate(-8 120 300)">OPEN 24H</text>
    <text x="610" y="330" font-size="26" fill="#7dff5e" filter="url(#glow)" transform="rotate(7 610 330)">HOTEL</text>
  </g>

  <!-- wet reflections -->
  <g opacity="0.5">
    <rect x="300" y="700" width="120" height="8" rx="4" fill="#ff2e88" filter="url(#soft)"/>
    <rect x="260" y="780" width="200" height="10" rx="5" fill="#00e5ff" filter="url(#soft)"/>
    <rect x="180" y="860" width="360" height="10" rx="5" fill="#ff7e3d" filter="url(#soft)"/>
  </g>
</svg>
